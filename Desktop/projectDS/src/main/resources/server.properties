# Student Attendance System Server Configuration

# RMI Configuration
rmi.service.name=AttendanceService
rmi.registry.port=1099
rmi.server.port=0
rmi.create.registry=true
rmi.server.hostname=localhost

# Security Configuration
server.encryption.enabled=true
rmi.security.manager.enabled=false
rmi.logging.enabled=false

# Server Capacity Configuration
server.max.concurrent.users=100

# Database Configuration (loaded from database.properties)
# See database.properties for database connection settings

# Logging Configuration
logging.level.root=INFO
logging.level.com.attendance.system=DEBUG