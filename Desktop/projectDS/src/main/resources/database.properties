# Database Configuration for Student Attendance System
# MySQL Database Connection Settings

# Database Connection
db.url=jdbc:mysql://localhost:3306/Wolde?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
db.pool.maximumPoolSize=20
db.pool.minimumIdle=5
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
db.pool.leakDetectionThreshold=60000

# Test Database Configuration
test.db.url=jdbc:mysql://localhost:3306/attendance_system_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
test.db.username=attendance_user
test.db.password=attendance_pass

# Application Settings
app.session.timeout=1800000
app.rmi.port=1100
app.rmi.host=localhost
app.backup.schedule=0 2 * * *
app.notification.batch.size=100
#run client and server using mvn exec:java -Dexec.mainClass="com.attendance.system.client.AttendanceGUI" and mvn exec:java -Dexec.mainClass="com.attendance.system.server.ServerLauncher" or mvn exec:java -Pserver and mvn exec:java -Pclient

